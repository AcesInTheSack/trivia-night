name: TestFlight

# Run manually from the Actions tab once the App Store secrets are set (see README).
on:
  workflow_dispatch:

permissions:
  contents: write   # match stores encrypted signing files on the match-certificates branch

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see README)"; missing=1; fi
          done
          exit $missing

      - name: Tools
        run: |
          brew install xcodegen
          gem install fastlane --no-document
          xcodegen generate

      - name: Write API key
        id: key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # Xcode expects the file to be named AuthKey_<KEY_ID>.p8
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # Accept either a base64-encoded .p8 or the raw file contents
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY_PATH"
            echo "Secret contained the raw .p8 text"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEY_PATH.raw"
            if grep -q "BEGIN PRIVATE KEY" "$KEY_PATH.raw"; then
              mv "$KEY_PATH.raw" "$KEY_PATH"
              echo "Secret was a base64-encoded .p8 file"
            else
              # Base64 of the key body only (DER). Rebuild a proper PEM .p8 around it.
              { echo "-----BEGIN PRIVATE KEY-----"
                printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | fold -w 64
                echo
                echo "-----END PRIVATE KEY-----"; } > "$KEY_PATH"
              rm -f "$KEY_PATH.raw"
              echo "Secret was the key body only; wrapped it as a .p8"
            fi
          fi
          if openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
            echo "Key parses OK"
          else
            echo "::error::ASC_KEY_P8_BASE64 does not contain a valid .p8 private key. Re-create the secret from the AuthKey .p8 file."
            exit 1
          fi
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_PATH: ${{ steps.key.outputs.path }}
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Encrypt the stored signing files with a password derived from the API key secret,
          # so nothing extra has to be added to the repo's secrets.
          export MATCH_PASSWORD=$(shasum -a 256 "$ASC_KEY_PATH" | cut -d' ' -f1)
          fastlane beta

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "*.ipa"
          if-no-files-found: ignore
