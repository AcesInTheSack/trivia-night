name: TestFlight

# Run manually from the Actions tab once the App Store secrets are set (see README).
# Signing follows the same approach as the Anywhere Game repo: each run creates a fresh
# Apple Distribution certificate and App Store profile through the API key, and revokes
# older certificates so the account stays under Apple's limit.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      BUNDLE_ID: com.acesinthesack.trivianight
      CERT_NAME: Trivia Night CI
      OUT_DIR: ${{ github.workspace }}/../signing
    steps:
      - name: Check secrets
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see README)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Write API key
        run: |
          # Xcode expects the file to be named AuthKey_<KEY_ID>.p8.
          # Accepts the raw .p8 text, a base64-encoded .p8 file, or just the key body.
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ["ASC_KEY_P8_BASE64"]
          m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", raw, re.S)
          if not m:
              try:
                  decoded = base64.b64decode(re.sub(r"\s", "", raw)).decode("utf-8", "ignore")
                  m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", decoded, re.S)
              except Exception:
                  m = None
          body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(1) if m else raw)
          if len(body) < 100:
              print("::error::ASC_KEY_P8_BASE64 doesn't look like an App Store Connect .p8 key.")
              sys.exit(1)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.environ["KEY_PATH"], "w").write(pem)
          print("Key file written.")
          PY
          openssl pkey -in "$KEY_PATH" -noout && echo "Key parses OK"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create signing certificate and profile
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/ci_signing.py setup

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TriviaNight.xcodeproj \
            -scheme TriviaNight \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TriviaNight.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -40

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TriviaNight.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows up in TestFlight after Apple finishes processing (usually 5 to 30 minutes)."

      - name: Clean up signing files
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/venv" ] || exit 0
          "$RUNNER_TEMP/venv/bin/python" scripts/ci_signing.py cleanup || true
