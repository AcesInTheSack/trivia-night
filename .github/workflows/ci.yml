name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulators
        id: sims
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))["devices"]
          ios = sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          devs = d[ios[-1]]
          iphone = next(x for x in devs if x["name"].startswith("iPhone") and "Pro" in x["name"]) if any("Pro" in x["name"] for x in devs) else next(x for x in devs if x["name"].startswith("iPhone"))
          ipad = next(x for x in devs if x["name"].startswith("iPad Pro")) if any(x["name"].startswith("iPad Pro") for x in devs) else next(x for x in devs if x["name"].startswith("iPad"))
          print(f"iphone={iphone['udid']}")
          print(f"ipad={ipad['udid']}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project TriviaNight.xcodeproj \
            -scheme TriviaNight \
            -destination "id=${{ steps.sims.outputs.iphone }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|warning: .*Swift|Test Case|Executed|BUILD|\*\*" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log

      - name: Screenshots (iPhone + iPad)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # perl-based timeout, since macOS has no `timeout` command
          t() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          APP=$(find build/Build/Products -name "TriviaNight.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          mkdir -p screenshots
          for kind in iphone ipad; do
            if [ "$kind" = ipad ]; then UDID=${{ steps.sims.outputs.ipad }}; else UDID=${{ steps.sims.outputs.iphone }}; fi
            echo "== $kind $UDID"
            t 30 xcrun simctl shutdown all || true
            t 120 xcrun simctl boot "$UDID" || true
            t 300 xcrun simctl bootstatus "$UDID" || echo "bootstatus timed out"
            t 120 xcrun simctl install "$UDID" "$APP" || { echo "install failed"; continue; }
            for screen in setup splash game answer end; do
              t 20 xcrun simctl terminate "$UDID" com.acesinthesack.trivianight 2>/dev/null || true
              t 60 xcrun simctl launch "$UDID" com.acesinthesack.trivianight -uiDemo "$screen" || echo "launch failed: $screen"
              sleep 5
              t 30 xcrun simctl io "$UDID" screenshot "screenshots/${kind}-${screen}.png" || echo "screenshot failed: $screen"
            done
          done
          ls -la screenshots

      - name: Publish screenshots to the screenshots branch
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          [ -n "$(ls screenshots 2>/dev/null)" ] || exit 0
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
