name: TriviaNight
options:
  bundleIdPrefix: com.acesinthesack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  TriviaNight:
    type: application
    platform: iOS
    sources:
      - path: TriviaNight
    info:
      path: TriviaNight/Info.plist
      properties:
        CFBundleDisplayName: Trivia Night
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.trivia-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acesinthesack.trivianight
        PRODUCT_NAME: TriviaNight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  TriviaNightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TriviaNightTests
    dependencies:
      - target: TriviaNight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acesinthesack.trivianight.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TriviaNight:
    build:
      targets:
        TriviaNight: all
        TriviaNightTests: [test]
    test:
      targets:
        - TriviaNightTests
